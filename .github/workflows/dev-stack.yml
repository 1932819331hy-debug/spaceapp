name: Dev stack from source

on:
  pull_request:
    paths:
      - ".github/workflows/dev-stack.yml"
      - ".nvmrc"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "CONTRIBUTING.md"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "deploy/docker/**"
  push:
    branches:
      - "evidence/dev-stack-65-macos-f7f91bb1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-stack:
    if: github.event_name != 'push'
    name: Real source stack lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Unit-test dev-stack contracts
        run: npm run test:dev-stack

      - name: Start full stack without a TTY
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:stack >"$RUNNER_TEMP/dev-stack.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/dev-stack-shell.pid"
          echo "source stack launched in background"

      - name: Verify readiness, owner setup, and OpenCode pane
        run: npm run verify:dev-stack

      - name: Stop and reset owned resources
        if: always()
        shell: bash
        run: |
          set +e
          npm run dev:stack -- down
          down_status=$?
          npm run dev:stack -- reset
          reset_status=$?

          shell_pid="$(cat "$RUNNER_TEMP/dev-stack-shell.pid" 2>/dev/null || true)"
          for _ in $(seq 1 50); do
            if [ -z "$shell_pid" ] || ! kill -0 "$shell_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          process_status=0
          if [ -n "$shell_pid" ] && kill -0 "$shell_pid" 2>/dev/null; then
            echo "dev-stack launcher process $shell_pid is still alive after reset" >&2
            process_status=1
            kill "$shell_pid" 2>/dev/null || true
          fi

          status_json="$(npm run --silent dev:stack -- status 2>/dev/null)"
          echo "$status_json"
          if echo "$status_json" | grep -q '"running": true'; then
            echo "dev-stack supervisor still reports running after reset" >&2
            process_status=1
          fi
          if ! echo "$status_json" | grep -q '"containers": \[\]'; then
            echo "dev-stack containers remain after reset" >&2
            process_status=1
          fi
          if ! echo "$status_json" | grep -q '"volumes": \[\]'; then
            echo "dev-stack volumes remain after reset" >&2
            process_status=1
          fi

          echo "--- dev-stack log ---"
          cat "$RUNNER_TEMP/dev-stack.log" 2>/dev/null || true
          if [ "$down_status" -ne 0 ] || [ "$reset_status" -ne 0 ] || [ "$process_status" -ne 0 ]; then
            exit 1
          fi

  macos-source-stack:
    if: github.event_name == 'push'
    name: macOS source stack evidence
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated Colima Docker engine
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$HOME/.colima/default"
          brew install colima docker docker-compose
          mkdir -p "$HOME/.docker/cli-plugins"
          compose_plugin="$(brew --prefix)/lib/docker/cli-plugins/docker-compose"
          test -x "$compose_plugin"
          if test ! -e "$HOME/.docker/cli-plugins/docker-compose" && test ! -L "$HOME/.docker/cli-plugins/docker-compose"; then
            ln -s "$compose_plugin" "$HOME/.docker/cli-plugins/docker-compose"
          fi
          echo "SPACEAPP_COLIMA_OWNED=1" >> "$GITHUB_ENV"
          colima start --runtime docker --cpu 2 --memory 6 --disk 20
          test "$(docker context show)" = "colima"
          docker info
          docker compose version

      - name: Unit-test dev-stack contracts
        run: npm run test:dev-stack

      - name: Start full stack without a TTY
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:stack >"$RUNNER_TEMP/dev-stack.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/dev-stack-shell.pid"
          echo "macOS source stack launched in background"

      - name: Verify readiness, owner setup, and OpenCode pane
        run: npm run verify:dev-stack

      - name: Stop and reset owned resources
        if: always()
        shell: bash
        run: |
          set +e
          npm run dev:stack -- down
          down_status=$?
          npm run dev:stack -- reset
          reset_status=$?

          shell_pid="$(cat "$RUNNER_TEMP/dev-stack-shell.pid" 2>/dev/null || true)"
          for _ in $(seq 1 50); do
            if [ -z "$shell_pid" ] || ! kill -0 "$shell_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done
          process_status=0
          if [ -n "$shell_pid" ] && kill -0 "$shell_pid" 2>/dev/null; then
            echo "dev-stack launcher process $shell_pid is still alive after reset" >&2
            process_status=1
            kill "$shell_pid" 2>/dev/null || true
          fi

          status_json="$(npm run --silent dev:stack -- status 2>/dev/null)"
          echo "$status_json"
          if echo "$status_json" | grep -q '"running": true'; then
            echo "dev-stack supervisor still reports running after reset" >&2
            process_status=1
          fi
          if ! echo "$status_json" | grep -q '"containers": \[\]'; then
            echo "dev-stack containers remain after reset" >&2
            process_status=1
          fi
          if ! echo "$status_json" | grep -q '"volumes": \[\]'; then
            echo "dev-stack volumes remain after reset" >&2
            process_status=1
          fi

          echo "--- dev-stack log ---"
          cat "$RUNNER_TEMP/dev-stack.log" 2>/dev/null || true
          if [ "$down_status" -ne 0 ] || [ "$reset_status" -ne 0 ] || [ "$process_status" -ne 0 ]; then
            exit 1
          fi

      - name: Remove only this job's Colima profile and data
        if: always() && env.SPACEAPP_COLIMA_OWNED == '1'
        run: colima delete --data -f
