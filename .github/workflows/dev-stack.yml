name: Dev stack from source

on:
  pull_request:
    paths:
      - ".github/workflows/dev-stack.yml"
      - ".nvmrc"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "CONTRIBUTING.md"
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "deploy/docker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-stack:
    name: Real source stack lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci

      - name: Unit-test dev-stack contracts
        run: npm run test:dev-stack

      - name: Start full stack without a TTY
        shell: bash
        run: |
          set -euo pipefail
          npm run dev:stack >"$RUNNER_TEMP/dev-stack.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/dev-stack-shell.pid"
          echo "source stack launched in background"

      - name: Verify readiness, owner setup, and OpenCode pane
        run: npm run verify:dev-stack

      - name: Stop and reset owned resources
        if: always()
        shell: bash
        run: |
          set +e
          npm run dev:stack -- down
          down_status=$?
          npm run dev:stack -- reset
          reset_status=$?
          echo "--- dev-stack log ---"
          cat "$RUNNER_TEMP/dev-stack.log" 2>/dev/null || true
          if [ "$down_status" -ne 0 ] || [ "$reset_status" -ne 0 ]; then
            exit 1
          fi
